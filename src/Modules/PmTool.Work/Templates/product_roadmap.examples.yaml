# 範例項目：示範目標 → 計畫 → 功能三層、各個狀態，以及一筆已過期的功能。
items:
  - ref: start
    type: goal
    title: 從這裡開始：路線圖怎麼用
    state: planning
    priority: low
    description: |
      這個專案有三種類型：目標、計畫、功能。計畫的上層項目是目標，功能的上層項目是計畫。
      三種類型共用同一個流程：構想 → 規劃中 → 進行中 → 已完成，暫時不做的放「擱置」。

      - 用「影響」與「信心」替計畫與功能排序，兩個都高的先做。
      - 「預計季度」選本季、下一季或之後，不用寫死日期。

      這幾筆是範例，看懂之後可以逐筆刪掉。
    fields:
      quarter: this_quarter
