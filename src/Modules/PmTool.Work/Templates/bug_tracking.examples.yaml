# 範例項目：示範缺陷在各個狀態的樣子，包含一筆已過期還沒修好的致命缺陷。
items:
  - ref: start
    type: bug
    title: 從這裡開始：缺陷怎麼用
    state: reported
    priority: low
    description: |
      這個專案只有一種類型「缺陷」，流程是：新回報 → 已確認 → 修正中 → 待驗證 → 已關閉。

      - 回報時填嚴重度、重現步驟、環境與發現版本；「不處理」用來收重複與無法重現的回報。
      - 驗證沒過可以從「待驗證」退回「修正中」。
      - 表格裡的「嚴重度」一眼看得出哪些最急，先處理「致命」與「嚴重」。

      這幾筆是範例，看懂之後可以逐筆刪掉。
